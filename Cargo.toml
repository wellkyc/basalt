[package]
name = "basalt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A BASIC interpreter with a REPL"
license = "MIT"
repository = "https://github.com/wellkyc/basalt"
readme = "README.md"
keywords = ["basic", "interpreter", "language", "repl", "qbasic"]
categories = ["command-line-utilities", "compilers"]

[profile.release]
lto = true
codegen-units = 1
strip = true
